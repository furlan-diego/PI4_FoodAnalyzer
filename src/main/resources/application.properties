# ========================================
# CONFIGURAÇÃO DO BANCO DE DADOS POSTGRESQL
# ========================================

# Substitua 'food_analyzer_db' pelo nome do seu banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/food_analyzer_db

# Substitua 'seu_usuario' pelo seu nome de usuário do PostgreSQL (o padrão geralmente é 'postgres')
spring.datasource.username=root

# Substitua 'sua_senha' pela sua senha do PostgreSQL
spring.datasource.password=root

# ========================================
# CONFIGURAÇÃO DO HIBERNATE (JPA)
# ========================================

# A mágica do Spring: 'update' verifica o estado do banco de dados e o atualiza
# conforme as suas classes de entidade (@Entity). Ele cria tabelas, adiciona colunas, etc.
# Ótimo para desenvolvimento. Para produção, usa-se 'validate' ou ferramentas de migração como Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console as queries SQL que o Hibernate está executando. Muito útil para debug.
spring.jpa.show-sql=true

# Formata o SQL exibido no console para ficar mais legível.
spring.jpa.properties.hibernate.format_sql=true
