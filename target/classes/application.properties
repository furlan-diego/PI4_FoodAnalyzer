# ========================================
# CONFIGURA��O DO BANCO DE DADOS POSTGRESQL
# ========================================

# Substitua 'food_analyzer_db' pelo nome do seu banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/food_analyzer_db

# Substitua 'seu_usuario' pelo seu nome de usu�rio do PostgreSQL (o padr�o geralmente � 'postgres')
spring.datasource.username=root

# Substitua 'sua_senha' pela sua senha do PostgreSQL
spring.datasource.password=root

# ========================================
# CONFIGURA��O DO HIBERNATE (JPA)
# ========================================

# A m�gica do Spring: 'update' verifica o estado do banco de dados e o atualiza
# conforme as suas classes de entidade (@Entity). Ele cria tabelas, adiciona colunas, etc.
# �timo para desenvolvimento. Para produ��o, usa-se 'validate' ou ferramentas de migra��o como Flyway/Liquibase.
spring.jpa.hibernate.ddl-auto=update

# Mostra no console as queries SQL que o Hibernate est� executando. Muito �til para debug.
spring.jpa.show-sql=true

# Formata o SQL exibido no console para ficar mais leg�vel.
spring.jpa.properties.hibernate.format_sql=true
